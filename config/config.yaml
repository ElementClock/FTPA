# FTPA 配置文件

# 数据文件路径
data:
  txt_file: "FTPD-AG600-007-QD-260509-G-1-飞机性能操稳-32.txt"
  excel_file: "matlab看飞测数据/参数名.xlsx"
  chunk_size: 10000
  trim_head: 50
  trim_tail: 50

# 飞机参数
aircraft:
  base_weight: 48487.0  # 任务总重量 (kg)
  base_rel_cg: 25.28    # 任务重心 (%)
  base_oli: 6000.0      # 任务油量 (kg)
  x0: 15.902            # 重心参考点
  l: 4.453              # 参考长度

# 输出配置
output:
  log_dir: "logs"
  result_dir: "data/results"
  plot_dir: "data/plots"

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/ftpa.log"
